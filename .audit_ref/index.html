<title>JeevikaAI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky nav under a thin demo ribbon; navy hero band with a floating dashboard preview;
   light content sections; assessment = voice stage + conversation card; dashboard = profile rail + roadmap stack */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#EAF0F7; --ink:#0E2238; --ink-2:#4B607A; --line:#D9E3EE;
  --navy:#163A63; --blue:#1479BD; --teal:#18A999;
  --link:#1479BD; --teal-ink:#0C7F72; --chip-bg:#E3F1FA; --chip-ink:#0F5E93; --logo-ink:#163A63;
  --warn-bg:#FFF4DB; --warn-ink:#6B4700; --warn-line:#EBCB7A;
  --bad:#B3402A;
  --on-hero:#FFFFFF; --on-hero-2:#C9DAEC;
  --shadow:0 1px 2px rgba(14,34,56,.06),0 8px 24px rgba(14,34,56,.07);
  --shadow-lg:0 24px 60px rgba(6,20,40,.35);
  --f-display:'Bricolage Grotesque','Hind',system-ui,sans-serif;
  --f-body:'Hind',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1828; --surface:#10253B; --surface-2:#16304C; --ink:#E6EEF7; --ink-2:#9DB2C8; --line:#244262;
    --link:#5DB4EE; --teal-ink:#3FD2C0; --chip-bg:#16395A; --chip-ink:#9ED3F5; --logo-ink:#EAF2FA;
    --warn-bg:#3A2E10; --warn-ink:#F2D58B; --warn-line:#6B5517; --bad:#F08A72;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1828; --surface:#10253B; --surface-2:#16304C; --ink:#E6EEF7; --ink-2:#9DB2C8; --line:#244262;
  --link:#5DB4EE; --teal-ink:#3FD2C0; --chip-bg:#16395A; --chip-ink:#9ED3F5; --logo-ink:#EAF2FA;
  --warn-bg:#3A2E10; --warn-ink:#F2D58B; --warn-line:#6B5517; --bad:#F08A72;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:clamp(1.55rem,3vw,2.15rem);font-weight:700}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
[id]{scroll-margin-top:92px}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:max(16px,4vw)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}

/* ribbon + nav */
.ribbon{background:#0B2442;color:#CFE0F1;font-size:.78rem}
.ribbon .wrap{display:flex;gap:12px;justify-content:space-between;align-items:center;padding-block:7px}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.07em;font-size:.72rem;color:#fff;background:rgba(24,169,153,.22);border:1px solid rgba(24,169,153,.6);padding:3px 11px;border-radius:999px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#2EDDC7}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;gap:16px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo-text{font:800 1.4rem/1 var(--f-display);color:var(--logo-ink);letter-spacing:-.02em}
.logo-text b{color:var(--teal);font-weight:800}
.logo.inverse .logo-text{color:#fff}
.nav-links{display:flex;gap:4px;margin-left:14px}
.nav-links button,.nav-panel button{background:none;border:0;padding:10px 14px;border-radius:10px;font-weight:600;color:var(--ink-2)}
.nav-links button:hover,.nav-panel button:hover{background:var(--surface-2);color:var(--ink)}
.nav-links button[aria-current="page"]{color:var(--link)}
.nav-cta{margin-left:auto}
.menu-btn{display:none;margin-left:8px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);align-items:center;justify-content:center;color:var(--ink)}
.nav-panel{display:none;border-top:1px solid var(--line);padding-block:8px 12px}
.nav-panel .wrap{display:grid;gap:4px}
.nav-panel button{text-align:left}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:12px 22px;border-radius:12px;border:1.5px solid transparent;font-weight:700;font-size:1rem;line-height:1.2;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:none}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn-teal{background:var(--teal);color:#06263F;box-shadow:0 8px 22px rgba(24,169,153,.35)}
.btn-teal:hover{background:#21BBAA}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(20,121,189,.28)}
.btn-primary:hover{background:#1A86CE}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--blue)}
.btn-light{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.btn-light:hover{background:rgba(255,255,255,.1)}
.btn-text{background:none;border:0;color:var(--link);font-weight:700;padding:8px 4px;min-height:40px;display:inline-flex;align-items:center;gap:8px}
.btn-sm{min-height:40px;padding:8px 14px;font-size:.92rem}

/* hero */
.hero{position:relative;color:var(--on-hero);overflow:hidden;
  background:radial-gradient(900px 420px at 88% 8%,rgba(24,169,153,.38),transparent 60%),radial-gradient(700px 520px at 0% 100%,rgba(20,121,189,.5),transparent 60%),linear-gradient(135deg,#0E2E50 0%,#163A63 60%,#12507F 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1.3px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 88%);mask-image:linear-gradient(180deg,#000,transparent 88%)}
.hero .wrap{position:relative}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(28px,4vw,56px);align-items:center;padding-block:clamp(28px,5vw,60px) clamp(36px,6vw,72px)}
.eyebrow-light{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:600;letter-spacing:.04em;color:#BFF3EA;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px}
.hero-title{font-size:clamp(2.3rem,5.2vw,3.75rem);font-weight:800;margin:18px 0 16px;letter-spacing:-.025em}
.hero-title span{display:block}
.hero-title span:last-child{color:#5EE6D2}
.hero-sub{font-size:1.1rem;color:var(--on-hero-2);max-width:52ch}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.proof{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:24px;font-size:.92rem;color:var(--on-hero-2);list-style:none;padding:0}
.proof li{display:flex;align-items:center;gap:7px}
.proof svg{color:#5EE6D2}

.preview-wrap{position:relative;padding-top:18px}
.voice-chip{position:absolute;z-index:2;left:14px;top:0;display:flex;align-items:center;gap:12px;background:#0B2442;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:14px;padding:9px 14px 9px 10px;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:floaty 5s ease-in-out infinite}
.vc-icon{width:32px;height:32px;border-radius:50%;background:var(--teal);color:#06263F;display:grid;place-items:center;flex:none}
.vc-label{font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:#9FC3E4}
.vc-text{font-weight:600;font-size:.98rem}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.preview{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:46px 22px 20px}
.pv-head{display:flex;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));color:#fff;display:grid;place-items:center;font:700 1.15rem var(--f-display);flex:none}
.avatar.lg{width:56px;height:56px;font-size:1.4rem}
.pv-name{font-weight:700;line-height:1.2}
.pv-meta{font-size:.85rem;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;letter-spacing:.05em;padding:3px 10px;border-radius:999px;background:var(--chip-bg);color:var(--chip-ink);white-space:nowrap}
.tag-warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.tag-teal{background:rgba(24,169,153,.16);color:var(--teal-ink)}
.tag-mute{background:var(--surface-2);color:var(--ink-2)}
.pv-head .tag{margin-left:auto}
.pv-label{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin:18px 0 9px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:center;margin-bottom:11px;font-size:.93rem;font-weight:600}
.bar-row span:last-child{font-variant-numeric:tabular-nums;color:var(--teal-ink)}
.bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--teal));animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:0}}
.pv-row{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--bg)}
.pv-row .icon-tile{width:38px;height:38px;border-radius:11px}
.pv-row b{display:block;font-size:.93rem;line-height:1.25}
.pv-row small{color:var(--ink-2);font-size:.82rem}
.pv-row .pay{margin-left:auto;font-weight:700;font-size:.85rem;color:var(--teal-ink);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

/* sections */
.section{padding-block:clamp(40px,6vw,76px)}
.section-head{max-width:640px;margin-bottom:28px}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-ink);margin-bottom:10px}
.section-head p{color:var(--ink-2);margin-top:10px;font-size:1.05rem}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:24px}
.card h3{margin:16px 0 8px}
.card p{color:var(--ink-2)}
.icon-tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.tile-blue{background:var(--chip-bg);color:var(--link)}
.tile-teal{background:rgba(24,169,153,.16);color:var(--teal-ink)}
.tile-navy{background:var(--navy);color:#fff}
.card .chips{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--chip-bg);color:var(--chip-ink);font-size:.85rem;font-weight:600;border:1px solid transparent}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--blue)}
button.chip[aria-pressed="true"]{background:var(--blue);color:#fff}

.band{background:var(--surface);border-block:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;list-style:none;padding:0;margin:0}
.step{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:22px}
.step:not(:last-child)::after{content:"";position:absolute;right:-18px;top:44px;width:18px;height:2px;background:var(--teal)}
.step-top{display:flex;align-items:center;justify-content:space-between}
.step-n{font:800 1.9rem var(--f-display);color:var(--line)}
.step h3{margin:14px 0 6px;font-size:1.1rem}
.step p{color:var(--ink-2);font-size:.95rem}
.cta-band{border-radius:24px;padding:clamp(24px,4vw,44px);color:#fff;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,#163A63,#12507F 70%,#16806F)}
.cta-band h2{max-width:20ch}
.cta-band p{color:var(--on-hero-2);margin-top:8px;max-width:48ch}

.footer{background:#0B2442;color:#B9CCE0;padding-block:36px 28px}
.footer-grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-start}
.footer p{max-width:62ch;font-size:.9rem;margin-top:12px}
.footer .fine{border-top:1px solid rgba(255,255,255,.12);margin-top:24px;padding-top:16px;font-size:.82rem;color:#8FA9C4;max-width:none}
.team{font-weight:700;color:#fff}

/* assessment */
.assess{padding-block:22px 56px}
.back-link{display:inline-flex;gap:8px;align-items:center;background:none;border:0;color:var(--ink-2);font-weight:600;padding:8px 0}
.assess-head{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin:6px 0 22px}
.assess-head p{color:var(--ink-2);margin-top:8px;max-width:56ch}
.assess-head h1{font-size:clamp(1.8rem,3.6vw,2.6rem);font-weight:800}
.assess-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
.stage{text-align:center}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px;max-width:100%}
.seg button{border:0;background:transparent;padding:10px 16px;border-radius:10px;font-weight:700;color:var(--ink-2);min-height:44px}
.seg button small{display:block;font-weight:500;font-size:.72rem;line-height:1.1}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.mic-wrap{display:grid;place-items:center;padding:26px 0 8px}
.mic{position:relative;width:136px;height:136px;border-radius:50%;border:0;background:linear-gradient(145deg,var(--blue),var(--navy));color:#fff;display:grid;place-items:center;box-shadow:0 14px 34px rgba(20,121,189,.38)}
.mic::before,.mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--teal);opacity:0}
.mic.idle{animation:breathe 3.2s ease-in-out infinite}
.mic.live{background:linear-gradient(145deg,#1FC2B0,#0E7C70)}
.mic.live::before{animation:ring 1.8s ease-out infinite}
.mic.live::after{animation:ring 1.8s ease-out .9s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.75);opacity:0}}
@keyframes breathe{0%,100%{box-shadow:0 14px 34px rgba(20,121,189,.38),0 0 0 0 rgba(24,169,153,0)}50%{box-shadow:0 14px 34px rgba(20,121,189,.38),0 0 0 16px rgba(24,169,153,.16)}}
.wave{display:flex;gap:4px;height:30px;align-items:center;justify-content:center;margin:10px 0 4px}
.wave i{width:4px;height:6px;border-radius:2px;background:var(--teal)}
.wave.on i{animation:wv 1s ease-in-out infinite}
@keyframes wv{0%,100%{height:6px}50%{height:26px}}
.status{min-height:3.4em;padding:10px 14px;border-radius:12px;color:var(--ink-2);font-size:.95rem;margin:6px 0 14px}
.status.err,.status.warn{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);text-align:left}
.status.live{color:var(--teal-ink);font-weight:700}
.heard{margin:0 0 14px;text-align:left;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;font-size:.95rem}
.heard small{display:block;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.stage-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.convo{display:flex;flex-direction:column;gap:18px}
.progress{display:flex;align-items:center;gap:14px;font-weight:700;font-size:.92rem;color:var(--ink-2)}
.prog-bar{flex:1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--teal));border-radius:99px;transition:width .35s}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--teal)}
.bubble{background:var(--chip-bg);border-radius:18px 18px 18px 4px;padding:16px 18px}
.bubble b{display:block;font:700 1.2rem/1.35 var(--f-display)}
.bubble .sub-en{display:block;margin-top:6px;font-size:.9rem;color:var(--ink-2)}
.bubble .who{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--chip-ink);font-weight:700;display:block;margin-bottom:6px}
label.lbl{display:block;font-weight:700;margin-bottom:8px;font-size:.92rem}
.field{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:1.08rem}
textarea.field{resize:vertical;min-height:92px}
.field:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(20,121,189,.2)}
.hint{font-size:.85rem;color:var(--ink-2);margin-top:8px}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.choice{display:flex;gap:12px;align-items:center;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600;min-height:56px}
.choice .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:#fff}
.choice[aria-checked="true"]{border-color:var(--blue);background:var(--chip-bg)}
.choice[aria-checked="true"] .dot{background:var(--blue);border-color:var(--blue)}
.nav-row{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.examples{margin-top:22px}
.examples h3{font-size:1.05rem;margin-bottom:4px}
.ex-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.ex-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg)}
.ex-card .q{font-weight:700}
.ex-card .a{margin-top:8px;padding:8px 12px;background:var(--chip-bg);border-radius:12px 12px 4px 12px;color:var(--ink)}
.ex-card small{display:block;color:var(--ink-2);margin-top:6px}

/* dashboard */
.dash-head{display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-end;padding-block:28px 18px}
.dash-head h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:800}
.hi-sub{font-family:var(--f-display);color:var(--ink-2);font-size:1.15rem;margin-top:6px}
.dash-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:14px;padding:12px 16px;font-size:.93rem;margin-bottom:22px}
.notice svg{flex:none;margin-top:2px}
.dash-grid{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start;padding-bottom:56px}
.profile{position:sticky;top:88px}
.profile .tag{margin-top:14px}
.prof-list{margin:16px 0 18px;display:grid;gap:14px}
.prof-list dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.prof-list dd{margin:4px 0 0;font-weight:600}
.prof-list .chips{margin-top:2px}
.prof-list .chip{font-size:.8rem;padding:3px 10px}
.stack{display:grid;gap:24px;min-width:0}
.block-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-end;margin-bottom:14px}
.block-head p{color:var(--ink-2);font-size:.95rem;margin-top:6px;max-width:60ch}
.path-card{display:grid;gap:14px}
.path-top{display:flex;gap:14px;align-items:flex-start}
.path-top .grow{flex:1;min-width:0}
.path-top h3{margin:0 0 2px}
.rank{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-ink)}
.path-meta{display:flex;flex-wrap:wrap;gap:8px}
.path-card .fit{color:var(--ink)}
.path-actions{display:flex;flex-wrap:wrap;gap:10px}
.why{border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:12px}
.factor{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.factor b{font-size:.95rem}
.factor span.pts{font-weight:700;font-variant-numeric:tabular-nums;color:var(--teal-ink)}
.factor span.pts.neg{color:var(--bad)}
.factor p{grid-column:1/-1;font-size:.88rem;color:var(--ink-2)}
.factor .bar{grid-column:1/-1;height:6px}
.why .total{font-size:.88rem;color:var(--ink-2);background:var(--bg);border-radius:10px;padding:10px 12px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.timeline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.stage-card{position:relative;border:1px solid var(--line);border-radius:16px;padding:18px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.stage-card.done{border-color:var(--teal);background:rgba(24,169,153,.1)}
.stage-card .k{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-ink)}
.stage-card h4{font-size:1.1rem}
.stage-card p{color:var(--ink-2);font-size:.93rem;flex:1}
.stage-card .wk{font-weight:700;font-size:.85rem}
.road-progress{display:flex;align-items:center;gap:12px;margin-top:16px;font-weight:700;font-size:.9rem;color:var(--ink-2)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.opp-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.opp{display:flex;flex-direction:column;gap:12px}
.opp.far{border-style:dashed;background:var(--bg)}
.opp-top{display:flex;gap:8px;flex-wrap:wrap}
.opp h3{margin:0;font-size:1.1rem}
.opp .org{font-size:.9rem;color:var(--ink-2);margin-top:2px}
.opp-facts{display:grid;gap:6px;font-size:.92rem}
.opp-facts div{display:flex;gap:8px;align-items:center}
.opp-facts svg{color:var(--ink-2);flex:none}
.opp-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.star[aria-pressed="true"]{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.empty{padding:28px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;color:var(--ink-2)}

/* overlay + toast */
.overlay{position:fixed;inset:0;background:rgba(6,20,36,.62);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;max-width:720px;width:100%;max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal pre{margin:0;padding:16px 20px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:.85rem/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;flex:1;min-height:0}
.modal-foot{display:flex;flex-wrap:wrap;gap:10px;padding:14px 20px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0B2442;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-lg);z-index:120;max-width:calc(100vw - 32px);font-weight:600;font-size:.95rem;animation:pop .25s ease-out both}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}

@media (max-width:980px){
  .hero-grid{grid-template-columns:minmax(0,1fr)}
  .assess-grid{grid-template-columns:minmax(0,1fr)}
  .dash-grid{grid-template-columns:minmax(0,1fr)}
  .profile{position:static}
  .grid-3{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .step:nth-child(2)::after{display:none}
  .ex-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .nav-links{display:none}
  .menu-btn{display:inline-flex}
  .nav-panel.open{display:block}
  .timeline,.opp-grid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .ribbon .hide-sm{display:none}
  .nav-cta{display:none}
  .menu-btn{margin-left:auto}
  .steps{grid-template-columns:minmax(0,1fr)}
  .step::after{display:none!important}
  .voice-chip{left:8px;right:8px}
  .seg button{padding:10px 10px}
  .logo-text{font-size:1.25rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
